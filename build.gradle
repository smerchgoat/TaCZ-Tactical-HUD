buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://maven.parchmentmc.org' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
        classpath 'org.parchmentmc:librarian:1.+'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.parchmentmc.librarian.forgegradle'
apply plugin: 'java'

version = "${minecraft_version}-${mod_version}"
group = mod_group
archivesBaseName = mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'parchment', version: parchment_version

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            // TaCZ ships SRG refmaps; remap them so its mixins apply in this deobfuscated dev environment.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"
            // ./gradlew runClient -PquickPlay="World Name" joins that singleplayer world straight away.
            if (project.hasProperty('quickPlay')) {
                args '--quickPlaySingleplayer', project.property('quickPlay')
            }
            mods {
                tacz_tactical_hud {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    flatDir { dir 'libs' }
    maven { url 'https://maven.shedaniel.me/' } // Cloth Config
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${forge_version}"

    // TaCZ is not published to a maven repository; its jar lives in libs/ (not committed).
    implementation fg.deobf("libs:tacz-1.20.1:${tacz_version}")
    // Optional: in-game settings screen.
    implementation fg.deobf("me.shedaniel.cloth:cloth-config-forge:${cloth_config_version}")
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand 'file': [jarVersion: project.version]
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Version' : mod_version,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.version,
        ])
    }
}

java {
    withSourcesJar()
}

jar.finalizedBy('reobfJar')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
